<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="304" data-layout="mobile" height="797" viewBox="0 0 304 797" role="img" aria-labelledby="diagram-title diagram-desc" style="background:#fdfbf9">
  <title id="diagram-title">How does an AI-assisted case file reach a human decision?</title><desc id="diagram-desc">The reviewer retains responsibility for the disposition. Corrections return to the evidence-linked draft, with an audit trail of the change and its reason.</desc><defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" viewBox="0 0 7 7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#69616d" />
    </marker>
  </defs>
  <g class="edges">
    <path class="edge" data-from="intake" data-to="calc" d="M152.0 90 V124" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="intake" data-to="attr" d="M34 50.0 H8 V278.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="calc" data-to="draft" d="M270 164.0 H296 V402.5 H270" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="attr" data-to="draft" d="M152.0 318 V352" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="draft" data-to="human" d="M152.0 453 V487" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="human" data-to="correct" d="M152.0 567 V611" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="human" data-to="final" d="M37 567 V578 H8 V747.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="correct" data-to="draft" d="M37 673 V684 H17 V402.5 H34" fill="none" stroke="#7c5a29" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" stroke-dasharray="5 3" />
  </g>
  <g class="edge-labels">
    <text x="152.0" y="595" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Unsupported</text>
    <text x="41" y="578" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Supported</text>
    <text x="41" y="684" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Revise</text>
  </g>
  <g class="nodes">
    <g class="node" data-node="intake">
      <rect x="34" y="10" width="236" height="80" rx="12" fill="#302c34" stroke="#302c34" stroke-width="1.3" />
      <text x="152.0" y="30.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Classify case data</text>
      <text x="152.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#f2e9f3">Sensitivity and permitted</text>
      <text x="152.0" y="71.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#f2e9f3">environment</text>
    </g>
    <g class="node" data-node="calc">
      <rect x="34" y="124" width="236" height="80" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="144.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Reconcile transactions</text>
      <text x="152.0" y="167.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Deterministic amounts and</text>
      <text x="152.0" y="185.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">timestamps</text>
    </g>
    <g class="node" data-node="attr">
      <rect x="34" y="238" width="236" height="80" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="258.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Qualify attribution</text>
      <text x="152.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Hash, label source, date and</text>
      <text x="152.0" y="299.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">confidence</text>
    </g>
    <g class="node" data-node="draft">
      <rect x="34" y="352" width="236" height="101" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="372.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Draft from permitted</text>
      <text x="152.0" y="393.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">evidence</text>
      <text x="152.0" y="416.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Attach source IDs to</text>
      <text x="152.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">material claims</text>
    </g>
    <g class="node" data-node="human">
      <rect x="34" y="487" width="236" height="80" rx="12" fill="#fff2c8" stroke="#b79538" stroke-width="1.3" />
      <text x="152.0" y="507.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#4b381c">Human review</text>
      <text x="152.0" y="530.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#665634">Are claims and uncertainties</text>
      <text x="152.0" y="548.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#665634">supported?</text>
    </g>
    <g class="node" data-node="correct">
      <rect x="34" y="611" width="236" height="62" rx="12" fill="#ffebe3" stroke="#d39883" stroke-width="1.3" />
      <text x="152.0" y="631.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#583a28">Correct or escalate</text>
      <text x="152.0" y="654.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#6e513d">Resolve gaps and log edits</text>
    </g>
    <g class="node" data-node="final">
      <rect x="34" y="707" width="236" height="80" rx="12" fill="#f1e2f4" stroke="#b392bd" stroke-width="1.3" />
      <text x="152.0" y="727.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#49334c">Authorize disposition</text>
      <text x="152.0" y="750.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5a465f">Record rationale and filing</text>
      <text x="152.0" y="768.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5a465f">decision</text>
    </g>
  </g>
</svg>