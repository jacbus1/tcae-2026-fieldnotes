<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="304" data-layout="mobile" height="722" viewBox="0 0 304 722" role="img" aria-labelledby="diagram-title diagram-desc" style="background:#fdfbf9">
  <title id="diagram-title">When should an alert become a network investigation?</title><desc id="diagram-desc">A common identifier supports a hypothesis. The investigator decides how far the evidence justifies expanding it. Reporting and control remediation have separate owners.</desc><defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" viewBox="0 0 7 7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#69616d" />
    </marker>
  </defs>
  <g class="edges">
    <path class="edge" data-from="signal" data-to="context" d="M152.0 72 V106" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="context" data-to="test" d="M152.0 168 V202" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="test" data-to="weak" d="M152.0 282 V326" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="test" data-to="strong" d="M37 282 V293 H8 V453.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="weak" data-to="report" d="M270 357.0 H296 V558.0 H270" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="strong" data-to="report" d="M152.0 484 V518" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="strong" data-to="defect" d="M37 484 V495 H17 V672.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
  </g>
  <g class="edge-labels">
    <text x="152.0" y="310" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Explained</text>
    <text x="41" y="293" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Corroborated</text>
    <text x="41" y="495" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Recurring gap</text>
  </g>
  <g class="nodes">
    <g class="node" data-node="signal">
      <rect x="34" y="10" width="236" height="62" rx="12" fill="#302c34" stroke="#302c34" stroke-width="1.3" />
      <text x="152.0" y="30.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Shared counterparty</text>
      <text x="152.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#f2e9f3">Alert or case referral</text>
    </g>
    <g class="node" data-node="context">
      <rect x="34" y="106" width="236" height="62" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="126.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Reconstruct fund flows</text>
      <text x="152.0" y="149.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Who paid whom, when and why?</text>
    </g>
    <g class="node" data-node="test">
      <rect x="34" y="202" width="236" height="80" rx="12" fill="#fff2c8" stroke="#b79538" stroke-width="1.3" />
      <text x="152.0" y="222.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#4b381c">Test the connection</text>
      <text x="152.0" y="245.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#665634">Ownership, timing and</text>
      <text x="152.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#665634">direction</text>
    </g>
    <g class="node" data-node="weak">
      <rect x="34" y="326" width="236" height="62" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="346.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Ordinary explanation</text>
      <text x="152.0" y="369.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Document and review the case</text>
    </g>
    <g class="node" data-node="strong">
      <rect x="34" y="422" width="236" height="62" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="442.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Corroborated link</text>
      <text x="152.0" y="465.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Expand the network analysis</text>
    </g>
    <g class="node" data-node="report">
      <rect x="34" y="518" width="236" height="80" rx="12" fill="#f1e2f4" stroke="#b392bd" stroke-width="1.3" />
      <text x="152.0" y="538.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#49334c">Case disposition</text>
      <text x="152.0" y="561.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5a465f">Assess reporting and record</text>
      <text x="152.0" y="579.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5a465f">why</text>
    </g>
    <g class="node" data-node="defect">
      <rect x="34" y="632" width="236" height="80" rx="12" fill="#ffebe3" stroke="#d39883" stroke-width="1.3" />
      <text x="152.0" y="652.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#583a28">Monitoring issue</text>
      <text x="152.0" y="675.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#6e513d">Scope and test any control</text>
      <text x="152.0" y="693.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#6e513d">gap</text>
    </g>
  </g>
</svg>