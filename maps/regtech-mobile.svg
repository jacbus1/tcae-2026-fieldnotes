<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="304" data-layout="mobile" height="758" viewBox="0 0 304 758" role="img" aria-labelledby="diagram-title diagram-desc" style="background:#fdfbf9">
  <title id="diagram-title">How does a vendor model earn and retain approval?</title><desc id="diagram-desc">Independent validation tests the use case and its dependencies. The accountable owner records operating limits and the evidence required to resume use after a failure.</desc><defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" viewBox="0 0 7 7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#69616d" />
    </marker>
  </defs>
  <g class="edges">
    <path class="edge" data-from="use" data-to="sample" d="M152.0 72 V106" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="use" data-to="feed" d="M34 41.0 H8 V242.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="sample" data-to="gate" d="M34 137.0 H17 V356.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="feed" data-to="gate" d="M152.0 282 V316" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="gate" data-to="release" d="M152.0 396 V440" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="gate" data-to="fix" d="M37 396 V407 H8 V690.0 H34" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="release" data-to="watch" d="M152.0 520 V554" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="watch" data-to="fix" d="M152.0 616 V650" fill="none" stroke="#69616d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    <path class="edge" data-from="fix" data-to="gate" d="M267 730 V741 H296 V356.0 H270" fill="none" stroke="#7c5a29" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrowhead)" stroke-dasharray="5 3" />
  </g>
  <g class="edge-labels">
    <text x="152.0" y="424" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Adequate</text>
    <text x="41" y="407" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Gaps</text>
    <text x="152.0" y="630" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Trigger breached</text>
    <text x="263" y="741" text-anchor="end" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#514b56" stroke="#fdfbf9" stroke-width="3" paint-order="stroke">Revalidate</text>
  </g>
  <g class="nodes">
    <g class="node" data-node="use">
      <rect x="34" y="10" width="236" height="62" rx="12" fill="#302c34" stroke="#302c34" stroke-width="1.3" />
      <text x="152.0" y="30.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Define intended use</text>
      <text x="152.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#f2e9f3">Decision owner and risk tier</text>
    </g>
    <g class="node" data-node="sample">
      <rect x="34" y="106" width="236" height="62" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="126.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Test performance</text>
      <text x="152.0" y="149.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Known cases and segments</text>
    </g>
    <g class="node" data-node="feed">
      <rect x="34" y="202" width="236" height="80" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="222.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Test dependencies</text>
      <text x="152.0" y="245.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Freshness, coverage and</text>
      <text x="152.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">fallback</text>
    </g>
    <g class="node" data-node="gate">
      <rect x="34" y="316" width="236" height="80" rx="12" fill="#fff2c8" stroke="#b79538" stroke-width="1.3" />
      <text x="152.0" y="336.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#4b381c">Independent challenge</text>
      <text x="152.0" y="359.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#665634">Are limits and evidence</text>
      <text x="152.0" y="377.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#665634">adequate?</text>
    </g>
    <g class="node" data-node="release">
      <rect x="34" y="440" width="236" height="80" rx="12" fill="#f1e2f4" stroke="#b392bd" stroke-width="1.3" />
      <text x="152.0" y="460.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#49334c">Approve within limits</text>
      <text x="152.0" y="483.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5a465f">Version and monitoring</text>
      <text x="152.0" y="501.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5a465f">triggers</text>
    </g>
    <g class="node" data-node="watch">
      <rect x="34" y="554" width="236" height="62" rx="12" fill="#ffffff" stroke="#ccc5ce" stroke-width="1.3" />
      <text x="152.0" y="574.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#28242c">Monitor live results</text>
      <text x="152.0" y="597.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#554f58">Overrides, drift and outages</text>
    </g>
    <g class="node" data-node="fix">
      <rect x="34" y="650" width="236" height="80" rx="12" fill="#ffebe3" stroke="#d39883" stroke-width="1.3" />
      <text x="152.0" y="670.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#583a28">Restrict or suspend</text>
      <text x="152.0" y="693.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#6e513d">Fallback, correction and</text>
      <text x="152.0" y="711.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#6e513d">retest</text>
    </g>
  </g>
</svg>